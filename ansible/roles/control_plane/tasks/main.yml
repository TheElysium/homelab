---
- name: Look for an existing control plane
  # admin.conf is the file kubeadm init writes last, so its presence means a
  # previous init went all the way through.
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Write the kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Initialise the control plane
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not control_plane_admin_conf.stat.exists
  changed_when: true

- name: Create the kubeconfig directory for {{ ansible_user }}
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install the admin kubeconfig for {{ ansible_user }}
  # cluster-admin, unrevocable short of rotating the CA. Acceptable only
  # because the machine has exactly one human user.
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
