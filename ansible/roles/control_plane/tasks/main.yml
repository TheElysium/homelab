---
- name: Look for an existing control plane
  # admin.conf is the file kubeadm init writes last, so its presence means a
  # previous init went all the way through.
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Write the kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Initialise the control plane
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not control_plane_admin_conf.stat.exists
  changed_when: true

- name: Create the kubeconfig directory for {{ ansible_user }}
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install the admin kubeconfig for {{ ansible_user }}
  # cluster-admin, unrevocable short of rotating the CA. Acceptable only
  # because the machine has exactly one human user.
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf_content

- name: Create the kubeconfig directory on the control station
  ansible.builtin.file:
    path: "{{ control_plane_local_kubeconfig | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Install the kubeconfig on the control station
  # admin.conf advertises the internal network, which the control station has no
  # route to. ansible_host is in the certificate SANs, so TLS still verifies.
  # Written by content rather than fetched: a fetched file would differ from the
  # remote one after the rewrite, and report changed on every run.
  ansible.builtin.copy:
    content: >-
      {{ control_plane_admin_conf_content.content | b64decode
         | replace('https://' ~ kube_apiserver_endpoint ~ ':' ~ kube_apiserver_port,
                   'https://' ~ ansible_host ~ ':' ~ kube_apiserver_port) }}
    dest: "{{ control_plane_local_kubeconfig }}"
    mode: "0600"
    backup: true
  delegate_to: localhost
  become: false
  no_log: true

- name: Bind the control-plane metrics endpoints to the internal network
  # No-op on a fresh cluster: kubeadm generated these manifests from the
  # template above. This is here for a cluster that was built before the
  # arguments existed, and it is what keeps the two representations from
  # diverging.
  ansible.builtin.replace:
    path: "{{ control_plane_manifest_dir }}/{{ item.manifest }}"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop: "{{ control_plane_metrics_endpoints }}"
  loop_control:
    label: "{{ item.manifest }}"

- name: Wait for the metrics endpoints to answer on the internal network
  # The kubelet watches the manifest directory and restarts the component on
  # its own. Waiting on internal_ip rather than the pod is what actually
  # proves the rebind: the previous process never listened there.
  ansible.builtin.wait_for:
    host: "{{ internal_ip }}"
    port: "{{ item.port }}"
    timeout: "{{ control_plane_metrics_timeout }}"
  loop: "{{ control_plane_metrics_endpoints }}"
  loop_control:
    label: "{{ item.manifest }}"

- name: Wait for the API server to be healthy again
  # Restarting etcd on a single-control-plane cluster leaves a window where
  # the API server is listening but answering nothing.
  ansible.builtin.command:
    cmd: kubectl get --raw /readyz
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_readyz
  until: control_plane_readyz is succeeded
  retries: 24
  delay: 5
  changed_when: false
