---
- name: Look for an existing control plane
  # admin.conf is the file kubeadm init writes last, so its presence means a
  # previous init went all the way through.
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Write the kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Initialise the control plane
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not control_plane_admin_conf.stat.exists
  changed_when: true

- name: Create the kubeconfig directory for {{ ansible_user }}
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install the admin kubeconfig for {{ ansible_user }}
  # cluster-admin, unrevocable short of rotating the CA. Acceptable only
  # because the machine has exactly one human user.
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf_content

- name: Create the kubeconfig directory on the control station
  ansible.builtin.file:
    path: "{{ control_plane_local_kubeconfig | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Install the kubeconfig on the control station
  # admin.conf advertises the internal network, which the control station has no
  # route to. ansible_host is in the certificate SANs, so TLS still verifies.
  # Written by content rather than fetched: a fetched file would differ from the
  # remote one after the rewrite, and report changed on every run.
  ansible.builtin.copy:
    content: >-
      {{ control_plane_admin_conf_content.content | b64decode
         | replace('https://' ~ kube_apiserver_endpoint ~ ':' ~ kube_apiserver_port,
                   'https://' ~ ansible_host ~ ':' ~ kube_apiserver_port) }}
    dest: "{{ control_plane_local_kubeconfig }}"
    mode: "0600"
    backup: true
  delegate_to: localhost
  become: false
  no_log: true
