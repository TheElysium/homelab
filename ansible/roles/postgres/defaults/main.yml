---
# CloudNativePG operator, Helm chart from https://cloudnative-pg.github.io/charts.
postgres_chart_version: 0.29.0
postgres_operator_namespace: cnpg-system

postgres_operator_values: {}

# The database itself. The operator creates one PVC per instance from these
# values; both are fixed at creation and resizing later needs an operator run.
postgres_namespace: postgres
postgres_cluster_name: postgres
postgres_instances: 1

# Backed by the storage VM through the nfs-client provisioner. NFS is an
# accepted storage class for PostgreSQL, unlike Prometheus's mmap'd blocks; see
# docs/decisions/0006-postgresql-on-cloudnativepg-with-nfs-storage.md.
#
# The declared size is not enforced by NFS — it is a directory on the export,
# and the real ceiling is the storage VM's 40 GB data disk. Filling it is
# watched, not prevented: WAL and database size land in Grafana.
postgres_storage_class: nfs-client
postgres_volume_size: 20Gi

postgres_addon_dir: /etc/kubernetes/addons
postgres_cluster_manifest: "{{ postgres_addon_dir }}/postgres-cluster.yaml"
postgres_dashboard_manifest: "{{ postgres_addon_dir }}/postgres-dashboard.yaml"

# The t0 MCP server reads the training marts through its own role. The role
# carries no memberships and no privileges of its own: its read access to
# mart.* and core.threshold is granted by t0's migration 020, so a cluster
# without that migration is a cluster the MCP cannot read from.
postgres_t0_mcp_role: t0_mcp_ro
# Matches the MCP server's own connection pool ceiling.
postgres_t0_mcp_connection_limit: 4

# Password holder for the role, in the postgres namespace. Type
# kubernetes.io/basic-auth, as CNPG's declarative role management requires;
# the cnpg.io/reload label makes the operator apply password changes from a
# replay instead of waiting for its next reconciliation pass. CNPG generates
# passwords for its reserved users, but not for managed roles, so this one is
# ours.
postgres_t0_mcp_password_secret: postgres-t0-mcp-ro

# The DSN Secret the t0 chart mounts but never creates. The host is the
# cluster's -rw service; the MCP only reads, but it is the conventional
# endpoint, and there is no replica pool to prefer a -ro service for.
postgres_t0_mcp_namespace: t0
postgres_t0_mcp_database: t0
postgres_t0_mcp_dsn_secret: t0-mcp-ro-dsn
postgres_t0_mcp_dsn_key: dsn

# Set in an ansible-vault file, like the Grafana admin password: it reaches
# the cluster only through the two Secrets above and is never committed.
postgres_t0_mcp_ro_password: "{{ t0_mcp_ro_password }}"

# The Grafana sidecar ships with kube-prometheus-stack and picks up dashboard
# ConfigMaps from its namespace by label.
postgres_dashboard_namespace: monitoring

postgres_rollout_timeout: 600s
