[defaults]
inventory = ./inventory.yml
roles_path = ./roles

callback_result_format = yaml

interpreter_python = /usr/bin/python3

[ssh_connection]
pipelining = true
# accept-new trusts a host seen for the first time, but still refuses one whose
# key changed: a rebuilt machine has to be purged from known_hosts by hand.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
