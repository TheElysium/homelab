---
# Read-only. Every host assertion here must hold both before and after the
# roles run; anything only true afterwards belongs to the role, not here.
#
#   ansible-playbook checks.yml
#
# The cluster-object plays at the end only hold once site.yml has built the
# cluster; against a bare machine only the host plays above can pass.

- name: Verify inventory data against the running machines
  hosts: all
  gather_facts: true
  become: false

  tasks:
    - name: The LAN address Ansible connected to is the one declared in the inventory
      ansible.builtin.assert:
        that: ansible_host == ansible_facts['default_ipv4']['address']
        fail_msg: >-
          {{ inventory_hostname }} answers on {{ ansible_host }} but its default
          route uses {{ ansible_facts['default_ipv4']['address'] }}.
        success_msg: "{{ ansible_host }}"

    - name: The internal interface exists and carries the declared address
      # internal_ip is duplicated between terraform/main.tf and inventory.yml;
      # this is what keeps the two in step.
      ansible.builtin.assert:
        that:
          - internal_iface in ansible_facts
          - ansible_facts[internal_iface]['ipv4'] is defined
          - ansible_facts[internal_iface]['ipv4']['address'] == internal_ip
        fail_msg: >-
          {{ inventory_hostname }} declares {{ internal_ip }} on
          {{ internal_iface }} but reports
          {{ ansible_facts[internal_iface]['ipv4']['address'] | default('no address') }}.
        success_msg: "{{ internal_iface }} = {{ internal_ip }}"

    - name: Reach the NFS server over the internal network
      # The default route goes through eth0, so this proves eth1 itself works.
      ansible.builtin.command:
        cmd: ping -c 2 -W 2 -I {{ internal_iface }} {{ nfs_server_ip }}
      changed_when: false

    - name: Reach the API server endpoint over the internal network
      ansible.builtin.command:
        cmd: ping -c 2 -W 2 -I {{ internal_iface }} {{ kube_apiserver_endpoint }}
      changed_when: false
      when: inventory_hostname in groups['k8s_cluster']

    - name: Read the current time on the host
      # Not ansible_facts.date_time: captured at fact gathering, already stale.
      ansible.builtin.command:
        cmd: date +%s
      changed_when: false
      register: remote_epoch

    - name: The clock is within five seconds of the control node
      ansible.builtin.assert:
        that: (remote_epoch.stdout | int - lookup('pipe', 'date +%s') | int) | abs < 5
        fail_msg: >-
          {{ inventory_hostname }} is
          {{ (remote_epoch.stdout | int - lookup('pipe', 'date +%s') | int) | abs }}s
          away from the control node.

    - name: Passwordless sudo works
      ansible.builtin.command:
        cmd: id -un
      become: true
      changed_when: false
      register: sudo_check
      failed_when: sudo_check.stdout != 'root'

- name: Verify the storage node
  hosts: storage
  gather_facts: false
  become: true

  tasks:
    - name: The data device is present
      ansible.builtin.stat:
        path: "{{ nfs_data_device }}"
      register: data_device

    - name: Report a missing data device
      ansible.builtin.assert:
        that: data_device.stat.exists and data_device.stat.isblk
        fail_msg: >-
          {{ nfs_data_device }} is not a block device. Check data_disk_gb in
          terraform/main.tf.

    - name: Read the filesystem currently on the data device
      ansible.builtin.command:
        cmd: lsblk --nodeps --noheadings --output FSTYPE {{ nfs_data_device }}
      changed_when: false
      register: data_device_fstype

    - name: The data device is either blank or already carries the expected filesystem
      # Never answer a failure here with force:true on the filesystem module.
      ansible.builtin.assert:
        that: data_device_fstype.stdout | trim in ['', nfs_data_fstype]
        fail_msg: >-
          {{ nfs_data_device }} carries a {{ data_device_fstype.stdout | trim }}
          filesystem, expected {{ nfs_data_fstype }} or nothing.
        success_msg: >-
          {{ nfs_data_device }}:
          {{ data_device_fstype.stdout | trim | default('blank', true) }}

- name: Verify the shared Gateway
  hosts: control_plane
  gather_facts: false
  become: true

  tasks:
    - name: Read the Programmed condition of the shared Gateway
      # Name, namespace and address mirror roles/cilium/defaults/main.yml;
      # failed_when: false so the assert below is what reports.
      ansible.builtin.command:
        cmd: >-
          kubectl get gateway homelab -n gateway-system
          -o 'jsonpath={.status.conditions[?(@.type=="Programmed")].status}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
      failed_when: false
      register: gateway_programmed

    - name: Read the address assigned to the shared Gateway
      ansible.builtin.command:
        cmd: >-
          kubectl get gateway homelab -n gateway-system
          -o jsonpath={.status.addresses[0].value}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
      failed_when: false
      register: gateway_address

    - name: The shared Gateway is programmed on the pinned address
      ansible.builtin.assert:
        that:
          - gateway_programmed.stdout == 'True'
          - gateway_address.stdout == '192.168.1.212'
        fail_msg: >-
          Gateway homelab/gateway-system is absent, not programmed, or not on
          192.168.1.212. The cilium role creates it; run ansible-playbook
          site.yml --tags cilium.
        success_msg: "homelab/gateway-system: {{ gateway_address.stdout }}"

- name: Verify the t0 MCP database access path
  hosts: control_plane
  gather_facts: false
  become: true

  tasks:
    # Names mirror roles/postgres/defaults/main.yml; failed_when: false so the
    # assert below is what reports.
    - name: Read the reconciled managed roles of the PostgreSQL cluster
      ansible.builtin.command:
        cmd: >-
          kubectl get cluster postgres -n postgres
          -o 'jsonpath={.status.managedRolesStatus.byStatus.reconciled}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
      failed_when: false
      register: t0_mcp_role_reconciled

    - name: Read the t0 MCP DSN secret
      ansible.builtin.command:
        cmd: kubectl get secret t0-mcp-ro-dsn -n t0
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
      failed_when: false
      register: t0_mcp_dsn_secret

    - name: The MCP role is reconciled and its DSN secret exists
      ansible.builtin.assert:
        that:
          - "'t0_mcp_ro' in t0_mcp_role_reconciled.stdout"
          - t0_mcp_dsn_secret.rc == 0
        fail_msg: >-
          The role t0_mcp_ro is not reconciled (status:
          {{ t0_mcp_role_reconciled.stdout | default('cluster unreadable') }})
          or secret t0-mcp-ro-dsn is missing from the t0 namespace. The
          postgres role creates both; run ansible-playbook site.yml
          --tags postgres --ask-vault-pass.
        success_msg: "t0_mcp_ro reconciled, t0-mcp-ro-dsn present in t0"
